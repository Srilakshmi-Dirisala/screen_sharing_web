<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Screen Share</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .video-container {
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto 20px;
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #screenVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: none; /* Initially hidden until we have a stream */
        }
        #screenVideo.visible {
            display: block;
        }
        /* Ensure video is visible when in fullscreen */
        :fullscreen #screenVideo,
        :-webkit-full-screen #screenVideo,
        :-moz-full-screen #screenVideo,
        :-ms-fullscreen #screenVideo {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain !important;
        }
        #placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-color: #1a1a1a;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        #placeholder.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .status-bar {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notification {
            position: fixed;
            /* Simplified status indicator */
        }
        #placeholder p {
            margin-top: 15px;
            color: #fff;
            font-size: 16px;
        }
        #liveBadge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ff4d4d;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 20;
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4CAF50;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 9999 !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video id="screenVideo" autoplay playsinline></video>
            <div id="placeholder" style="display: none;">
                <div class="spinner"></div>
                <p>Connecting to live stream...</p>
            </div>
            <div id="liveBadge">LIVE</div>
        </div>
        
        <div class="status-bar">
            <div id="status">Live Stream - Connected</div>
            <div class="viewer-count">
                <i class="fas fa-circle" style="color: #ff4d4d; font-size: 10px; margin-right: 5px;"></i>
                <span id="viewerCount">1</span> watching
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script>
        // Check if Firebase is configured
        function isFirebaseConfigured() {
            return typeof FIREBASE_CONFIG !== 'undefined' && 
                   FIREBASE_CONFIG.apiKey && 
                   FIREBASE_CONFIG.databaseURL;
        }
    </script>
    <script src="viewer.js"></script>
    
    <script>
        // Initialize the viewer
        document.addEventListener('DOMContentLoaded', () => {
            const viewer = new VideoViewer();
            console.log('🚀 Live Stream Viewer initialized');
            
            const video = document.getElementById('screenVideo');
            const placeholder = document.getElementById('placeholder');
            const liveBadge = document.getElementById('liveBadge');
            
            if (video) {
                // Handle autoplay with sound
                const playWithAudio = async () => {
                    try {
                        await video.play();
                        console.log('Video playback started with audio');
                        if (placeholder) placeholder.style.display = 'none';
                        if (liveBadge) liveBadge.style.display = 'block';
                    } catch (err) {
                        console.warn('Autoplay with audio failed:', err);
                        // If autoplay with sound fails, try with muted
                        video.muted = true;
                        await video.play();
                        console.log('Video playback started (muted)');
                        if (placeholder) placeholder.style.display = 'none';
                        if (liveBadge) liveBadge.style.display = 'block';
                    }
                };
                
                video.onloadedmetadata = playWithAudio;
                
                // Show live badge when video starts playing
                video.onplaying = () => {
                    console.log('Video is playing');
                    if (placeholder) placeholder.style.display = 'none';
                    if (liveBadge) liveBadge.style.display = 'block';
                };
                
                // Handle any playback errors
                video.onerror = (e) => {
                    console.error('Video error:', video.error);
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                        const statusText = placeholder.querySelector('p');
                        if (statusText) statusText.textContent = 'Error loading stream';
                    }
                };
            }
            
            // Enable fullscreen on click
            document.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(console.error);
                }
            });
            
            // Toggle fullscreen with F key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'f' || e.key === 'F') {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        document.documentElement.requestFullscreen().catch(console.error);
                    }
                }
            });
        });
    </script>
</body>
</html>
